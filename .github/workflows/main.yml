name: Bulls Signals Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache cooldown file
        uses: actions/cache@v4
        with:
          path: cooldown.json
          key: bulls-cooldown-${{ github.run_id }}
          restore-keys: bulls-cooldown-

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python bulls_signals_bot.py
